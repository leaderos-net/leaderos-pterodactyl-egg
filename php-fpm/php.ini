zend_extension = /usr/local/lib/ioncube/ioncube_loader_lin_8.5.so
allow_url_fopen=On
short_open_tag=On
upload_max_filesize=128M
post_max_size=128M
max_input_vars=10000
memory_limit=512M
max_execution_time=600
max_input_time=600
display_errors=Off
log_errors=On
error_log=/home/container/logs/php_errors.log
error_reporting=E_ALL & ~E_DEPRECATED
